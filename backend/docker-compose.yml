version: '3.9'
services:
  db:
    image: postgres:15
    container_name: sereneai_db
    environment:
      POSTGRES_DB: serene
      POSTGRES_USER: serene
      POSTGRES_PASSWORD: serene
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serene -d serene"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db_data:

