# SereneApps maintainability analysis for thesis Chapter IV.
# Confirm these values against the SonarQube Cloud/SonarCloud project
# Information page before running final thesis analysis.
sonar.projectKey=Dentalization_SereneApps
sonar.organization=dentalization
sonar.projectName=SereneApps Teledentistry
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,web/src,mobile/src,backend/python_service
sonar.tests=backend/tests,web/tests,mobile/__tests__,backend/python_service/tests

sonar.inclusions=\
  backend/src/middleware/**,\
  backend/src/config/**,\
  backend/src/utils/**,\
  backend/src/routes/auth/**,\
  backend/src/services/auth/**,\
  backend/src/routes/auth.js,\
  backend/src/routes/appointments/**,\
  backend/src/services/appointments/**,\
  backend/src/routes/appointments.js,\
  backend/src/controllers/appointmentsController.js,\
  backend/src/routes/communications/**,\
  backend/src/services/communications/**,\
  backend/src/sockets/**,\
  backend/src/controllers/xCoreController.js,\
  backend/python_service/**,\
  web/src/contexts/**,\
  web/src/config/**,\
  web/src/utils/auth/**,\
  web/src/services/**,\
  web/src/components/auth/**,\
  web/src/pages/dentist-portal/teledentistry/**,\
  web/src/pages/dentist-portal/ai/**,\
  web/src/pages/clinic-portal/patients/**,\
  web/src/pages/admin-portal/dentist-management/**,\
  mobile/src/contexts/**,\
  mobile/src/config/**,\
  mobile/src/components/teledentistry/**,\
  mobile/src/services/**,\
  mobile/src/navigation/**,\
  mobile/src/store/**,\
  mobile/src/utils/**,\
  mobile/src/features/appointment/screens/AppointmentListScreen.jsx,\
  mobile/src/features/appointment/screens/DetailAppointmentScreen.jsx,\
  mobile/src/features/appointment/screens/PatientTeledentistryScreen.jsx,\
  mobile/src/features/appointment/screens/BookingSlotScreen.jsx,\
  mobile/src/features/ai-diagnosis/screens/AIHomeScreen.jsx,\
  mobile/src/features/ai-diagnosis/screens/AnalysisScreen.jsx,\
  mobile/src/features/ai-diagnosis/screens/DetailHistoryScreen.jsx,\
  mobile/src/features/ai-diagnosis/screens/ResultScreen.jsx

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  .maintainability-venv/**,\
  **/venv/**,\
  **/.venv/**,\
  **/android/**,\
  **/ios/**,\
  **/uploads/**,\
  **/logs/**,\
  **/generated/**,\
  backend/src/generated/**,\
  backend/python_service/tests/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.test.mjs,\
  **/*.spec.js,\
  **/*.spec.jsx

sonar.test.inclusions=\
  backend/tests/**/*.js,\
  web/tests/**/*.mjs,\
  mobile/__tests__/**/*.js,\
  backend/python_service/tests/**/*.py

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,mobile/coverage/lcov.info
sonar.python.version=3.11
