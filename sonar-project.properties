# SereneApps maintainability analysis for thesis Chapter IV.
# Replace these placeholders with the project key and organization from
# SonarQube Cloud/SonarCloud or your SonarQube Server project settings.
sonar.projectKey=SERENEAPPS_PROJECT_KEY_REPLACE_ME
sonar.organization=SERENEAPPS_ORGANIZATION_REPLACE_ME
sonar.projectName=SereneApps Teledentistry
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,web/src,mobile/src,backend/python_service
sonar.tests=backend/tests,web/tests,mobile/__tests__,backend/python_service/tests

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  .maintainability-venv/**,\
  **/android/**,\
  **/ios/**,\
  **/uploads/**,\
  **/logs/**,\
  **/generated/**,\
  backend/src/generated/**,\
  backend/python_service/tests/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.test.mjs,\
  **/*.spec.js,\
  **/*.spec.jsx

sonar.test.inclusions=\
  backend/tests/**/*.js,\
  web/tests/**/*.mjs,\
  mobile/__tests__/**/*.js,\
  backend/python_service/tests/**/*.py

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,mobile/coverage/lcov.info
sonar.python.version=3.11

# Optional for SonarQube Server local runs:
# sonar.host.url=https://your-sonarqube.example.com
