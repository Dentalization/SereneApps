name: SonarQube Maintainability Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  maintainability:
    name: Static maintainability analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Radon
        run: python -m pip install radon==6.0.1

      - name: Generate ESLint maintainability reports
        run: npm run maintainability:eslint

      - name: Generate Radon CDSS maintainability reports
        run: npm run maintainability:radon

      - name: Validate maintainability setup
        run: npm run maintainability:validate

      - name: Upload maintainability result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-results
          path: maintainability-results/
          if-no-files-found: error

      - name: Run SonarQube maintainability scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
